services:
  redis:
    image: redis:7-alpine
    container_name: nep_lyricist_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: always

  factory:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
      - ./conductor:/app/conductor
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=true
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  playground:
    build: .
    container_name: nep_lyricist_playground
    command: streamlit run factory/playground_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

volumes:
  redis_data:
